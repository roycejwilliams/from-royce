name: Test Storage rules in emulator
on:
  pull_request:
    paths:
      - storage.rules
      - firebase.storage-test.json
      - tests/storage-rules.cjs
      - tests/storage/**
      - .github/workflows/storage-rules-test.yml
permissions:
  contents: read
jobs:
  storage_rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
        working-directory: tests/storage
      - run: npm test
        working-directory: tests/storage
